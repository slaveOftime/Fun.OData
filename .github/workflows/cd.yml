name: cd - build and publish nuget packages

on:
  #push:
  #  branches:
  #  - master
  release:
    types: [published]
    

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: NuGet login (OIDC -> short-lived API key)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        # nuget.org profile name (the owner of the trusted publishing policy)
        user: slaveoftime

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Install dependencies
      run: dotnet tool restore

    - name: Run tests
      run: dotnet test      

    - name: Publish nuget packages
      run: |
        dotnet pack -c Release src/Fun.OData.Query/Fun.OData.Query.fsproj -o .
        dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json -k ${{steps.nuget-login.outputs.NUGET_API_KEY}} --skip-duplicate
    
